name: Publish to PyPI

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+rc[0-9]+'

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    container:   # we have to provide a working triqs installation to make the cmake step work
      image: flatironinstitute/triqs:4.0.x
      options: --user root

    steps:
    - uses: actions/checkout@v7
    - name: Install pypa/build
      run: |
        pip3 install --user build toml --break-system-packages
    - name: prepare python distribution
      run: |
        git config --global --add safe.directory ${GITHUB_WORKSPACE}
        cmake -S . -B build/
        cp build/packaging/pypi/* ./
        mv build/python/triqs_dft_tools/version.py ./python/triqs_dft_tools/version.py
        rm ./python/triqs_dft_tools/version.py.in
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish PyPI 🐍
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/triqs_dft_tools
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true # skip if version name package already exists on pypi
